<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="popup.css" />
    <script src="../solver.js"></script>
    <script src="popup.js" type="module"></script>
    <title>Hitbullseye Automate</title>
</head>

<body>
    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 32 32" width="30" height="30">
                <defs>
                    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#c4b5fd" />
                        <stop offset="1" stop-color="#7c5cf5" />
                    </linearGradient>
                </defs>
                <path d="M6 5h5v22H6zM21 5h5v22h-5z" fill="url(#lg)" />
                <path d="M18 7l-8 10h5l-2 8 8-10h-5z" fill="#fff" stroke="#1a1530" stroke-width="1.2" stroke-linejoin="round" />
            </svg>
        </div>
        <div class="brand">
            <h1>Hitbullseye Automate</h1>
            <p>AI test solver</p>
        </div>
    </header>

    <main>
        <section class="card">
            <div class="card-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M19 4l2 2"/></svg>
                <span>AI key</span>
            </div>
            <div class="field-row">
                <input type="password" id="api_key" placeholder="Gemini key (several: separate with commas)" autocomplete="off" spellcheck="false" />
                <button class="icon-btn" id="toggle_key" title="Show / hide key" aria-label="Show or hide key">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button class="btn btn-soft" id="test_key">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="0.5"/></svg>
                Test API key connection
            </button>
            <p class="hint">Used by the AI to solve the test.</p>
        </section>

        <!-- Kept in the DOM (hidden) because popup.js reads it -->
        <input type="text" id="test_answer_key" hidden />

        <section class="card">
            <div class="card-title">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
                <span>Settings</span>
            </div>
            <div class="setting">
                <label for="time">Delay per question</label>
                <span class="badge" id="time_value">1s</span>
            </div>
            <input type="range" id="time" min="0.3" max="10" value="1" step="0.1" />
            <div class="setting">
                <label for="double_check" title="Two models answer each question; a third settles any they disagree on. Uses about twice the requests">Double-check answers</label>
                <label class="switch">
                    <input type="checkbox" id="double_check" checked />
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting">
                <label for="auto_submit">Auto-submit when done</label>
                <label class="switch">
                    <input type="checkbox" id="auto_submit" checked />
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <div class="actions">
            <button class="btn btn-primary" id="start">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Start
            </button>
            <button class="btn btn-outline" id="stop">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                Stop
            </button>
        </div>
        <button class="btn btn-soft btn-lg" id="copy_questions">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy questions for an AI chat
        </button>

        <div id="status" class="status" hidden></div>
    </main>

    <footer>Made by ethical hacker</footer>
</body>

</html>
